name: Build and Push Docker Image (GHCR Only)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*", "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GitHub Container Registry 이미지 이름
  # 필요 시 ghcr.io/${{ github.repository }} 로 변경하여 저장소명과 동일하게 설정할 수도 있습니다.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ssh-agent_esp-rs

jobs:
  # 1. QEMU 없이 아키텍처별 네이티브 러너에서 각각 빌드 (100% 하드웨어 네이티브 속도)
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub 내장 GITHUB_TOKEN을 사용하여 GHCR 로그인 (별도 Secret 설정 불필요)
      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 아키텍처별 고유 태그 생성 (소문자 변환 자동 처리)
      - name: Extract metadata for arch tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,suffix=-${{ matrix.arch }}

      - name: Build and push arch-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. 빌드된 amd64 및 arm64 이미지를 단일 멀티 아키텍처 매니페스트(Manifest)로 병합
  merge:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 최종 배포용 태그 추출 (latest, branch, semver 등)
      - name: Extract Docker metadata for final tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # GHCR 멀티 아키텍처 매니페스트 생성 및 푸시
      - name: Create and push GHCR multi-arch manifest
        run: |
          TAG_ARGS=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags | map("-t " + .) | join(" ")')
          BASE_IMAGE=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[0]' | cut -d: -f1)
          docker buildx imagetools create ${TAG_ARGS} \
            ${BASE_IMAGE}:sha-${{ github.sha }}-amd64 \
            ${BASE_IMAGE}:sha-${{ github.sha }}-arm64
